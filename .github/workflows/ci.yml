name: CI
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
jobs:
  ci:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup WSL
        uses: Particular/setup-wsl-action@v1.2.0
      - name: Run
        uses: ./
        with:
          connection-string-name: MongoDBConnectionString
          mongodb-port: 27018
          mongodb-replica-set: "tr0"
      - name: Check result
        shell: pwsh
        run: |
          $connstr = $Env:MongoDBConnectionString
          Write-Host "Connection String: $connstr"

          if (-not $connstr) {
            throw "Environment variable 'MongoDBConnectionString' not set."
          }

          if ($connstr -notmatch '^mongodb://\S+:\d+/\?replicaSet=tr0$') {
            throw "Connection string does not match expected format."
          }

          # The mongosh shim forwards to the container on both platforms.
          $serverStatus = (mongosh "$connstr" --eval "db.serverStatus().ok" --quiet) -join "`n"
          Write-Host "serverStatus ok: $serverStatus"

          if ($LASTEXITCODE -ne 0) {
            throw "mongosh failed with exit code $LASTEXITCODE — MongoDB is not responding."
          }
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src --configuration Release
      - name: Run tests
        uses: Particular/run-tests-action@v1.7.0
