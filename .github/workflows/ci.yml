name: CI
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
jobs:
  ci:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup WSL
        uses: Particular/setup-wsl-action@v1.2.0
      - name: Run
        uses: ./
        with:
          connection-string-name: MongoDBConnectionString
          mongodb-port: 27018
          mongodb-replica-set: "tr0"
      - name: Check result
        shell: pwsh
        run: |
          $connstr = $Env:MongoDBConnectionString
          Write-Host "Connection String: $connstr"

          if (-not $connstr) {
            throw "Environment variable 'MongoDBConnectionString' not set."
          }

          if ($connstr -notmatch '^mongodb://\S+:\d+/\?replicaSet=tr0$') {
            throw "Connection string does not match expected format."
          }

          # The mongosh shim forwards to the container on both platforms.
          $serverStatus = (mongosh "$connstr" --eval "db.serverStatus().ok" --quiet) -join "`n"
          Write-Host "serverStatus ok: $serverStatus"

          if ($LASTEXITCODE -ne 0) {
            throw "mongosh failed with exit code $LASTEXITCODE — MongoDB is not responding."
          }

          # Regression guard: mongod must run with a capped WiredTiger cache (1GB) and a
          # raised fd limit. Without the cap the default cache (50% of RAM) plus connection
          # churn OOM-kills mongod inside the 4GB WSL2 VM on Windows runners, and without
          # the raised fd limit mongod dies with "Too many open files" under the load of a
          # real acceptance suite — both surface as EndOfStreamException in clients.
          $cacheBytes = (mongosh "$connstr" --eval "db.serverStatus().wiredTiger.cache['maximum bytes configured']" --quiet) -join "`n"
          $cacheGb = [double]($cacheBytes -replace '[^\d.]+', '') / 1GB
          Write-Host "WiredTiger cache: $([Math]::Round($cacheGb, 2)) GB"
          if ([Math]::Abs($cacheGb - 1.0) -gt 0.1) {
            throw "WiredTiger cache is not capped at 1GB (got $([Math]::Round($cacheGb, 2)) GB)."
          }
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src --configuration Release
      - name: Run tests
        uses: Particular/run-tests-action@v1.8.0
