name: setup-mongodb-action
description: Set up and teardown a MongoDB server for testing
inputs:
  connection-string-name:
    description: The name of the environment variable to fill with the MongoDB connection string.
    required: false
    default: MongoDBConnectionString
  mongodb-replica-set:
    description: The name of the replica set to configure. No replica set is configured when omitted.
    required: false
  mongodb-version:
    description: The tag of the MongoDB container image to use.
    required: false
    default: "7.0.6"
  mongodb-port:
    description: The port MongoDB listens on.
    required: false
    default: "27017"
runs:
  using: node24
  main: dist/index.mjs
  post: dist/index.mjs
